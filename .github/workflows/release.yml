name: release
# Push a tag to publish: git tag v0.2.0 && git push origin v0.2.0
# Builds the signed APK and a universal (Apple Silicon + Intel) Ginga.app in a .dmg, then creates the
# GitHub release with both and SHA256SUMS. The text is docs/releases/<tag>.md (what's new, written for
# people who use Ginga; the job fails without it) followed by .github/release-notes.md (downloads and
# installation). Tags with a suffix (v0.2.0-beta.1) become pre-releases. Keys: scripts/setup-release-signing.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes exist
        run: |
          test -s "docs/releases/$GITHUB_REF_NAME.md" || { echo "::error::write docs/releases/$GITHUB_REF_NAME.md (what's new in this version) and tag again"; exit 1; }

  android:
    needs: notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: run scripts/setup-release-signing.sh"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Tests and signed release APK
        working-directory: android
        env:
          GINGA_KEYSTORE: ${{ runner.temp }}/release.jks
          GINGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew test assembleRelease -Pginga.version="${GITHUB_REF_NAME#v}" --console=plain
      - name: Verify and rename
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$apk"
          mkdir dist && cp "$apk" "dist/Ginga-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  mac:
    needs: notes
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: mac
        run: swift test
      - name: Signing identity
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MAC_SIGNING_P12_BASE64 is not set: signing ad-hoc, so users re-grant permissions after every update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/release.p12"
          echo "GINGA_SIGN_IDENTITY=Ginga Release" >> "$GITHUB_ENV"
      - name: Universal Ginga.app
        working-directory: mac
        env:
          GINGA_ARCHS: arm64 x86_64
        run: GINGA_VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Package
        run: |
          codesign --display --verbose=2 mac/build/Ginga.app 2>&1 | grep -E "Authority|Identifier|Signature"
          # a disk image with the app and a shortcut to Applications: open it, drag Ginga across
          mkdir -p dist dmg && ditto mac/build/Ginga.app dmg/Ginga.app && ln -s /Applications dmg/Applications
          hdiutil create -volname "Ginga ${GITHUB_REF_NAME#v}" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/Ginga-${GITHUB_REF_NAME#v}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/

  publish:
    needs: [android, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          { cat "docs/releases/$GITHUB_REF_NAME.md"; echo; sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g; s/{{TAG}}/$GITHUB_REF_NAME/g" .github/release-notes.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Ginga ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
