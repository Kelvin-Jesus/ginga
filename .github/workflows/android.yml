name: android
on:
  push:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (golden vectors included) and debug build
        working-directory: android
        run: ./gradlew test assembleDebug --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
