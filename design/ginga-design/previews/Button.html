<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button</title>
<style>html,body{margin:0} body{background:var(--bg);padding:24px;} </style></head>
<body class="g-root">

<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <button class="g-btn g-btn--primary"><svg class="g-btn__star" viewBox="0 0 10 10" aria-hidden="true"><path fill="var(--star)" d="M5 0 6 4 10 5 6 6 5 10 4 6 0 5 4 4Z"/></svg>Criar display</button>
  <button class="g-btn">Tela de Ajustes…</button>
  <button class="g-btn g-btn--ghost">Mostrar prévia</button>
  <button class="g-btn g-btn--danger">Esquecer</button>
  <button class="g-btn" disabled>Aplicar</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px">
  <button class="g-btn g-btn--primary g-btn--pill">Conectar</button>
  <button class="g-btn g-btn--pill">Desconectar</button>
  <button class="g-btn g-btn--sm">Esquecer</button>
</div>
</body>
</html>
