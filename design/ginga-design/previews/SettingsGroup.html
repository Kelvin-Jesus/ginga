<!-- @dsCard group="Estrutura" height=300 subtitle="Grupo de linhas, substitui o Form do Mac" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SettingsGroup</title>
<style>html,body{margin:0} body{background:var(--bg);padding:24px;} </style></head>
<body class="g-root">

<div style="max-width:520px">
  <h3 class="g-group-title">Display</h3>
  <div class="g-group">
    <div class="g-row"><span class="g-row__icon"><svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="g-row__label">Resolução<span class="g-row__sub">Parece 1280 × 800, pixel exato</span></span><span class="g-row__value g-mono">2560×1600</span></div>
    <div class="g-row"><span class="g-row__icon"><svg viewBox="0 0 16 16"><path d="M8 2 9.3 6.7 14 8 9.3 9.3 8 14 6.7 9.3 2 8 6.7 6.7Z" fill="currentColor"/></svg></span><span class="g-row__label">Taxa de atualização</span><span class="g-row__value">60 Hz · eficiente</span></div>
    <label class="g-row"><span class="g-row__icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="g-row__label">HiDPI (Retina)</span><span class="g-switch"><input type="checkbox" role="switch" checked><span class="g-switch__track"></span><span class="g-switch__thumb"></span></span></label>
  </div>
  <p class="g-help">60 Hz gasta cerca de um terço da energia de 120 Hz para o mesmo stream de 60 fps.</p>
</div>
</body>
</html>
